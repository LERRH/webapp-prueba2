<!-- Google tag (gtag.js) -->

    <link rel="stylesheet" href="/assets/css/base.css">
<style>
        :root {
            --garnet-1: #6b0f1a;
            --garnet-2: #3d0a10;
            --garnet-text: #b5334a;
            --grey-card: #26262b;
            --grey-border: rgba(255, 255, 255, 0.16);
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0D0D0D;
            color: #ffffff;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
        }

        svg.icon {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ===== HERO ===== */
        .hero {
            position: relative;
            padding: 34px 16px;
            background-image: url('assets/icons/portada.jpg');
            background-size: cover;
            background-position: center 30%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(13,13,13,0.5) 0%, rgba(13,13,13,0.78) 70%, #0D0D0D 100%);
        }

        .hero-inner {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 640px;
            margin: 0 auto;
        }

        .hero-logo {
            width: 58px;
            height: 58px;
            flex-shrink: 0;
            filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.6));
        }

        .hero-text h1 {
            font-size: 1.55rem;
            font-weight: 700;
            line-height: 1.1;
        }

        .hero-text h1 span {
            color: var(--garnet-text);
        }

        /* ===== PAGE / SECTIONS ===== */
        .page {
            flex: 1;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 6px 14px 90px;
            display: flex;
            flex-direction: column;
        }

        .section {
            margin-top: 14px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .section-title .icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .section-title .rule {
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--garnet-1), transparent);
            border-radius: 2px;
        }

        /* ===== ACCESO RÁPIDO ===== */
        .quick-grid {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .quick-card {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 10px 12px;
            border-radius: 14px;
            text-decoration: none;
            color: #ffffff;
        }

        .quick-card:active {
            transform: scale(0.97);
        }

        .quick-card.garnet {
            background: linear-gradient(155deg, var(--garnet-1) 0%, var(--garnet-2) 100%);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .quick-card.grey {
            background: var(--grey-card);
            border: 1px solid var(--grey-border);
        }

        .quick-icon {
            width: 30px;
            height: 30px;
        }

        .quick-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-top: 4px;
        }

        .quick-title {
            font-size: 0.88rem;
            font-weight: 700;
            line-height: 1.15;
        }

        .quick-arrow {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.16);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .quick-arrow svg {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .quick-desc {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .quick-card-split {
            flex-direction: row;
            padding: 0;
            align-items: stretch;
        }

        .split-half {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 8px;
            text-decoration: none;
            color: #ffffff;
        }

        .split-divider {
            width: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 12px 0;
        }

        .quick-icon.small {
            width: 24px;
            height: 24px;
        }

        .split-title {
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* ===== MÓDULOS ===== */
        .modules-grid {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .module-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px 6px;
            border-radius: 14px;
            background: var(--grey-card);
            border: 1px solid var(--grey-border);
            text-decoration: none;
            color: #ffffff;
            text-align: center;
        }

        .module-card:active {
            transform: scale(0.97);
        }

        .module-icon {
            width: 26px;
            height: 26px;
        }

        .module-title {
            font-size: 0.78rem;
            font-weight: 700;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: auto;
            padding-top: 6px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ===== TELEGRAM FAB ===== */
        .telegram-fab {
            position: fixed;
            bottom: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            z-index: 1000;
        }

        .telegram-fab-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
            display: block;
        }

        /* ===== PANTALLAS BAJAS: aún más compacto ===== */
        @media (max-height: 700px) {
            .hero {
                padding: 22px 16px;
            }

            .hero-logo {
                width: 46px;
                height: 46px;
            }

            .hero-text h1 {
                font-size: 1.35rem;
            }

            .section {
                margin-top: 10px;
            }

            .quick-card {
                padding: 8px 10px;
            }

            .quick-icon {
                width: 26px;
                height: 26px;
            }
        }

        /* ===== PANTALLAS MÁS ANCHAS ===== */
        @media (min-width: 480px) {
            .hero-logo {
                width: 66px;
                height: 66px;
            }

            .hero-text h1 {
                font-size: 1.9rem;
            }
        }
    </style>
</head>
